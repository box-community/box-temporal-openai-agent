[project]
name = "global-signal-desk"
version = "0.1.0"
description = "Durable multilingual research with Temporal, OpenAI, Box, and Box AI"
authors = [{ name = "Global Signal Desk contributors" }]
requires-python = ">=3.11,<3.15"
readme = "README.md"
license = "MIT"
dependencies = [
    "boxsdk>=10,<11",
    "openai>=2.17.0,<3",
    "pydantic>=2.12.0,<3",
    "python-dotenv>=1.1.0,<2",
    "temporalio>=1.24.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<10",
    "pytest-asyncio>=0.24.0,<2",
    "pytest-timeout>=2.3.1",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".tooling", ".uv-cache", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
